name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx turbo test typecheck
      - name: Package (unsigned, ADR-0010)
        working-directory: apps/desktop
        run: bun run package
      - uses: actions/upload-artifact@v4
        with:
          name: kuro-macos-arm64
          path: apps/desktop/dist/mac-arm64
          retention-days: 7

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx turbo typecheck
      # shortcut: desktop tests use unix sockets and POSIX signals; port them when issue 08 lands.
      - run: bunx turbo test --filter=!@kuro/desktop
      - name: Install mingw-w64 (System Proxy helper compiler)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
          path-type: inherit
      - name: Package (unsigned, ADR-0010; builds kuro-sysproxy.exe first)
        working-directory: apps/desktop
        shell: msys2 {0}
        run: bun run package:win
      - name: System Proxy tests (mocked helper + real helper, read-only)
        working-directory: apps/desktop
        run: bunx vitest run src/main/platform/system-proxy.test.ts src/main/platform/sysproxy-helper.integration.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: kuro-windows-x64
          path: apps/desktop/dist/win-unpacked
          retention-days: 7
