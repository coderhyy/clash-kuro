name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx turbo test typecheck
      - name: Package dmg (ad-hoc signed, not notarized; ADR-0010)
        working-directory: apps/desktop
        run: bun run package
      - uses: actions/upload-artifact@v7
        with:
          name: kuro-macos-arm64
          path: apps/desktop/dist/clash-kuro-*-arm64.dmg
          retention-days: 7

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx turbo typecheck
      # shortcut: desktop tests use unix sockets and POSIX signals; port them when issue 08 lands.
      - run: bunx turbo test --filter=!@kuro/desktop
      - name: Install mingw-w64 (System Proxy helper compiler)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      # Package in pwsh, not the msys2 shell: msys2's GNU tar shadows Windows bsdtar and cannot unzip the Core.
      # ucrt64\bin has gcc/windres but no tar.
      - name: Package (unsigned, ADR-0010; builds kuro-sysproxy.exe first)
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $env:PATH = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin;$env:PATH"
          bun run package:win
      - name: System Proxy and session-end tests (mocked helper + real helper, read-only)
        working-directory: apps/desktop
        run: bunx vitest run src/main/platform/system-proxy.test.ts src/main/platform/sysproxy-helper.integration.test.ts src/main/app/session-end.test.ts
      - uses: actions/upload-artifact@v7
        with:
          name: kuro-windows-x64
          path: apps/desktop/dist/win-unpacked
          retention-days: 7
