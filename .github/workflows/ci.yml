name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx turbo test typecheck
      - name: Package dmg (ad-hoc signed, not notarized; ADR-0010)
        working-directory: apps/desktop
        run: bun run package
      - name: Bundled Core integration (no System Proxy writes)
        working-directory: apps/desktop
        env:
          KURO_REQUIRE_CORE: '1'
          KURO_READ_ONLY_BOOT_EVIDENCE: '1'
        run: bunx vitest run src/main/platform/mihomo.integration.test.ts --maxWorkers=2
      - uses: actions/upload-artifact@v7
        with:
          name: kuro-macos-arm64
          path: apps/desktop/dist/clash-kuro-*-arm64.dmg
          retention-days: 7

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx turbo typecheck
      - run: bunx turbo test --filter=!@kuro/desktop
      - name: Install mingw-w64 (System Proxy helper compiler)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc
      # Package in pwsh, not the msys2 shell: msys2's GNU tar shadows Windows bsdtar and cannot unzip the Core.
      # ucrt64\bin has gcc/windres but no tar.
      - name: Package (unsigned, ADR-0010; builds kuro-sysproxy.exe first)
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $env:PATH = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin;$env:PATH"
          bun run package:win
      - name: Verify packaged helper and record exact tested commit
        shell: pwsh
        run: |
          $bin = 'apps/desktop/dist/win-unpacked/resources/bin'
          $helper = Join-Path $bin 'kuro-sysproxy.exe'
          $helperHash = (Get-FileHash -LiteralPath $helper -Algorithm SHA256).Hash
          if ($helperHash -ne (Get-FileHash apps/desktop/resources/win/x64/kuro-sysproxy.exe).Hash) { throw 'Packaged helper mismatch' }
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path $helper))
          $pe = [BitConverter]::ToInt32($bytes, 60)
          if ([BitConverter]::ToUInt32($bytes, $pe) -ne 0x4550 -or [BitConverter]::ToUInt16($bytes, $pe + 4) -ne 0x8664 -or [BitConverter]::ToUInt16($bytes, $pe + 24 + 68) -ne 2) { throw 'Helper must be x64 GUI-subsystem PE' }
          @{ sourceCommit = (git rev-parse HEAD).Trim(); runId = $env:GITHUB_RUN_ID; helperSha256 = $helperHash; residentEnabledByDefault = $true; residentProtocol = 3 } | ConvertTo-Json | Set-Content -Encoding utf8 apps/desktop/dist/win-unpacked/build-identity.json
      - name: All desktop tests (real named pipes and bundled Core; no System Proxy writes)
        working-directory: apps/desktop
        env:
          KURO_REQUIRE_CORE: '1'
          KURO_READ_ONLY_BOOT_EVIDENCE: '1'
        run: bun run test
      - name: Isolated helper coordination and rescue controls (fake operations only)
        shell: pwsh
        run: |
          $env:PATH = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin;$env:PATH"
          $env:OBJDUMP = 'objdump'
          node apps/desktop/node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .scratch/mvp/prototypes/prestarted-helper-deadline/build.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .scratch/mvp/prototypes/prestarted-helper-deadline/test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .scratch/mvp/prototypes/prestarted-helper-deadline/resident-test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .scratch/mvp/prototypes/prestarted-helper-deadline/native/admission-test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .scratch/mvp/prototypes/prestarted-helper-deadline/platform-test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .scratch/mvp/prototypes/prestarted-helper-deadline/test.mjs --watchdog-negative-control
          if ($LASTEXITCODE -ne 1) { throw 'Rescued fixtures must fail exit acceptance' }
          node -e "const r=require('./.scratch/mvp/prototypes/prestarted-helper-deadline/out/negative.json'); const a=require('node:assert/strict'); a.equal(r.accepted,false); a.equal(r.negativeControlsObserved,true)"
      - name: Preserve helper coordination evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kuro-helper-coordination-evidence
          path: |
            .scratch/mvp/prototypes/prestarted-helper-deadline/out/runs/*/results.json
            .scratch/mvp/prototypes/prestarted-helper-deadline/out/resident-*/**/*.json
            .scratch/mvp/prototypes/prestarted-helper-deadline/out/resident-*/**/*.log
            .scratch/mvp/prototypes/prestarted-helper-deadline/out/admission-native/**/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Guarded real WinINet cycle (isolated runner only; backup and restore)
        shell: pwsh
        run: |
          $env:PATH = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin;$env:PATH"
          node .scratch/mvp/prototypes/wininet-recovery/build.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .scratch/mvp/prototypes/wininet-recovery/test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test .scratch/mvp/prototypes/wininet-recovery/competitors.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .scratch/mvp/prototypes/wininet-recovery/run.mjs --exercise
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .scratch/mvp/prototypes/wininet-recovery/run.mjs --exercise --resident=plain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .scratch/mvp/prototypes/wininet-recovery/run.mjs --exercise --resident=aware
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .scratch/mvp/prototypes/wininet-recovery/run.mjs --exercise --resident=recover
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node .scratch/mvp/prototypes/wininet-recovery/run.mjs --exercise --resident=serve
      - name: Preserve verified WinINet result (no registry exports)
        uses: actions/upload-artifact@v7
        with:
          name: kuro-wininet-recovery-evidence
          path: .scratch/mvp/prototypes/wininet-recovery/out/verified*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: kuro-windows-x64
          path: apps/desktop/dist/win-unpacked
          retention-days: 7
