appId: dev.kuro.desktop
productName: Clash Kuro
afterSign: scripts/verify-macos-app.cjs
directories:
  output: dist
  buildResources: build
files:
  - out/**
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
# Core, Geo data and licenses come from scripts/fetch-core.mjs (ADR-0012); never inside app.asar.
extraResources:
  - from: resources/core/${platform}-${arch}
    to: core
  - from: resources/core/geo
    to: core/geo
  - from: resources/core/licenses
    to: licenses
  - from: resources/core/core.lock.json
    to: core/core.lock.json
mac:
  target:
    - target: dmg
      arch: [arm64]
  icon: build/icon.icns
  # Ad-hoc integrity signature; no Developer ID or notarization (ADR-0010).
  identity: '-'
  # Ad-hoc Electron needs a separate proven native authorization boundary; helper start remains closed.
  hardenedRuntime: false
dmg:
  artifactName: clash-kuro-${version}-${arch}.${ext}
win:
  target: dir
  icon: build/icon.ico
  # System Proxy helper (issue 08); built by scripts/build-sysproxy.mjs, outside app.asar.
  extraResources:
    - from: resources/win/x64/kuro-sysproxy.exe
      to: bin/kuro-sysproxy.exe
