appId: dev.kuro.desktop
productName: Clash Kuro
directories:
  output: dist
  buildResources: build
files:
  - out/**
# Core, Geo data and licenses come from scripts/fetch-core.mjs (ADR-0012); never inside app.asar.
extraResources:
  - from: resources/core/${platform}-${arch}
    to: core
  - from: resources/core/geo
    to: core/geo
  - from: resources/core/licenses
    to: licenses
  - from: resources/core/core.lock.json
    to: core/core.lock.json
mac:
  target:
    - target: dmg
      arch: [arm64]
  icon: build/icon.icns
  # Ad-hoc only, not code signing; users still need xattr (ADR-0010).
  identity: '-'
  hardenedRuntime: false
dmg:
  artifactName: clash-kuro-${version}-${arch}.${ext}
win:
  target: dir
  icon: build/icon.ico
